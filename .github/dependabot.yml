version: 2
updates:
  - package-ecosystem: npm
    directory: /fabric-poc
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-tooling:
        dependency-type: development
  - package-ecosystem: npm
    directory: /deploy/cloudflare
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /deploy/cloudflare-mailer
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
