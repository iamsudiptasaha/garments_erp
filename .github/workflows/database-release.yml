name: Approved employee and contacts database release
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full reviewed main commit SHA
        required: true
        type: string
      confirm_project:
        description: Type kidvckaicclqvtlddeyz to confirm the production target
        required: true
        type: string
      backup_confirmed:
        description: A recent production backup and recovery path have been checked
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: production-database-release
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  migrate:
    needs: checks
    if: github.ref == 'refs/heads/main' && needs.checks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: fabric-poc/package-lock.json
      - run: npm --prefix fabric-poc ci --ignore-scripts
      - name: Apply only the reviewed employee and contact migrations atomically
        run: node scripts/ci/database-release.mjs
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRM_PROJECT: ${{ inputs.confirm_project }}
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
          RELEASE_GATE_RESULT: ${{ needs.checks.result }}
