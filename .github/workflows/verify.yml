name: ERP CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: erp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    name: Quality and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_DATA_MODE: demo
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: fabric-poc/package-lock.json
      - run: npm --prefix fabric-poc ci
      - run: npm --prefix fabric-poc run quality
      - run: node database/test-access-catalogue.mjs
      - run: node --test scripts/ci/security.test.mjs
      - name: Isolated Gmail mailer adapter checks
        run: |
          npm --prefix deploy/cloudflare-mailer ci --ignore-scripts
          npm --prefix deploy/cloudflare-mailer test
          npm --prefix deploy/cloudflare-mailer run build
      - name: Check locked account service types and dependencies
        run: |
          npx --yes deno@2.9.6 check --frozen --config supabase/functions/erp-accounts/deno.json supabase/functions/erp-accounts/index.ts scripts/ci/serve-accounts-local.ts
          npx --yes deno@2.9.6 audit --lock supabase/functions/erp-accounts/deno.lock --level moderate
      - run: bash scripts/ci/install-actionlint.sh
      - run: .ci-tools/actionlint -shellcheck= .github/workflows/*.yml
      - run: node scripts/ci/config-policy.mjs
      - run: node scripts/ci/portability-check.mjs
      - run: node scripts/ci/bundle-guard.mjs
      - run: npm --prefix fabric-poc exec playwright install --with-deps chromium
      - run: npm --prefix fabric-poc run e2e
      - name: Portable build provenance
        run: |
          mkdir -p reports
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("reports/release.json",JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID},null,2))'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portable-build-${{ github.run_id }}
          path: |
            fabric-poc/dist/
            reports/release.json
          retention-days: 7
          if-no-files-found: error
  security:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm --prefix fabric-poc ci --ignore-scripts
      - run: npm --prefix fabric-poc audit --audit-level=moderate
      - run: npm --prefix deploy/cloudflare ci --ignore-scripts
      - run: npm --prefix deploy/cloudflare audit --audit-level=moderate
      - run: npm --prefix deploy/cloudflare-mailer ci --ignore-scripts
      - run: npm --prefix deploy/cloudflare-mailer audit --audit-level=moderate
      - run: bash scripts/ci/install-gitleaks.sh
      - name: Full-history secret detection with complete redaction
        run: .ci-tools/gitleaks git --redact=100 --no-banner --log-level=error .
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          output: sarif
          upload: false
      - run: node scripts/ci/check-sarif.mjs sarif
      - name: Publish trusted security results
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          sarif_file: sarif
  database:
    name: Isolated database safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm --prefix fabric-poc ci --ignore-scripts
      - name: Start disposable local database
        run: npx --yes supabase@2.122.0 start --workdir database/ci/project -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /tmp/erp-ci-db-start.log 2>&1
      - name: Schema replay, permissions, constraints, atomicity, concurrency and restore
        run: bash scripts/ci/test-database.sh
      - name: Real local Auth, TOTP and private Storage integration
        run: |
          umask 077
          npx --yes supabase@2.122.0 status --workdir database/ci/project -o json > /tmp/erp-test-runtime.json 2>/tmp/erp-ci-status.log
          npx --yes deno@2.9.6 run --frozen --config supabase/functions/erp-accounts/deno.json --allow-env --allow-read=/tmp/erp-test-runtime.json --allow-net=127.0.0.1,localhost scripts/ci/serve-accounts-local.ts > /tmp/erp-ci-account-service.log 2>&1 &
          account_pid=$!
          trap 'kill "$account_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail -X OPTIONS http://127.0.0.1:55425/ > /dev/null; then break; fi
            sleep 1
          done
          TEST_ACCOUNTS_SERVICE=1 TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55422/postgres node fabric-poc/integration/auth-storage-http.mjs
      - name: Lint database functions in the isolated instance
        run: npx --yes supabase@2.122.0 db lint --local --schema garments_erp,garments_access --fail-on error --workdir database/ci/project
      - name: Stop and discard local database
        if: always()
        run: npx --yes supabase@2.122.0 stop --workdir database/ci/project --no-backup
  gate:
    name: Release gate
    if: always()
    needs: [quality, security, codeql, database]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - run: node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(j=>j.result!=="success")) process.exit(1); console.log("All required checks passed")'
