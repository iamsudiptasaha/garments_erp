name: Verify and deploy Cloudflare Workers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_DATA_MODE: ${{ vars.CLOUDFLARE_WORKER_NAME != '' && 'supabase' || 'demo' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    defaults:
      run:
        working-directory: fabric-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: fabric-poc/package-lock.json
      - run: npm ci
      - name: Validate production browser configuration
        if: vars.CLOUDFLARE_WORKER_NAME != ''
        run: node --input-type=module -e "import {readEnvironment} from './src/foundation/environment.js'; readEnvironment(process.env)"
      - name: Lint, unused code, duplication, tests and build
        run: npm run quality
      - name: Access catalogue checks
        run: node ../database/test-access-catalogue.mjs
      - name: Dependency security check
        run: npm audit --audit-level=high
      - name: Save duplication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplication-report
          path: fabric-poc/reports/duplication/
          if-no-files-found: ignore
          retention-days: 14

      - name: Save verified site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_WORKER_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: fabric-poc/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_WORKER_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cloudflare-workers-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          [[ "$CLOUDFLARE_WORKER_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "Invalid Worker name"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: fabric-poc/dist
      - name: Deploy verified artifact to Cloudflare Workers
        run: npx --yes wrangler@4.156.0 deploy --config wrangler.json --name="$CLOUDFLARE_WORKER_NAME"
