name: Deployment and protection drift monitoring
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci/verify-deployment.mjs
        env:
          DEPLOYMENT_URL: ${{ vars.PRODUCTION_DEPLOYMENT_URL }}
      - run: node scripts/ci/environment-policy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_POLICY_TOKEN: ${{ secrets.GH_POLICY_TOKEN }}
      - run: node scripts/ci/config-policy.mjs
      - run: node scripts/ci/portability-check.mjs
